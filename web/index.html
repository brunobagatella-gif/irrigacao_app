<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Minha Horta: irrigação inteligente com ESP32, lógica fuzzy e rede neural.">
  <meta name="theme-color" content="#2E7D32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Minha Horta">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Minha Horta · Irrigação Inteligente</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F4F7F2; }
    #carregando {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: Roboto, "Segoe UI", Arial, sans-serif; color: #1B5E20;
    }
    #carregando img { width: 96px; height: 96px; animation: cresce 1.6s ease-in-out infinite; }
    #carregando b { font-size: 20px; }
    #carregando span { font-size: 13px; color: #5C665A; }
    @keyframes cresce { 0%,100% { transform: scale(.94); } 50% { transform: scale(1.04); } }
  </style>
</head>
<body>
  <div id="carregando">
    <img src="icons/Icon-192.png" alt="">
    <b>Minha Horta</b>
    <span>Carregando a irrigação inteligente...</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('carregando');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
