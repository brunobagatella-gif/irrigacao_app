# Gera o SITE (GitHub Pages) e o APK do Android a cada push na branch main.
# Não precisa instalar Flutter no computador: o GitHub compila tudo.
# Antes da primeira vez: Settings > Pages > Source = "GitHub Actions".
name: Site e APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar pastas de plataforma (não sobrescreve arquivos existentes)
        run: flutter create --org br.facens --project-name irrigacao_app --platforms web,android .

      - name: Ajustes do Android (internet e minSdk)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's/android:label="irrigacao_app"/android:label="Minha Horta"/' $M
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle* || true

      - run: flutter pub get

      - name: Ícone do app Android
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Testes
        run: flutter test

      - name: Compilar o site
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar o APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: minha-horta-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
